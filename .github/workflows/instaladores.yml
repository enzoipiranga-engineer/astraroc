# Gera os instaladores do app de computador (Tauri) e publica na página de Releases.
# Dispara ao criar uma tag v* (ex.: v0.1.0) ou à mão em Actions.
name: Instaladores
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Instalador ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            targets: wasm32-unknown-unknown
          - name: macOS (Intel e Apple Silicon)
            os: macos-latest
            args: --target universal-apple-darwin
            targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas do sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: ASTRA v__VERSION__
          releaseBody: |
            Baixe o instalador do seu sistema em **Assets**, logo abaixo:
            - **Windows:** `ASTRA_..._x64-setup.exe` — dê dois cliques. Se aparecer "O Windows protegeu o computador", clique em *Mais informações* → *Executar assim mesmo* (o instalador não é assinado).
            - **Mac:** `ASTRA_..._universal.dmg` — abra e arraste o ASTRA para Aplicativos. Na primeira vez, clique com o botão direito no app → *Abrir* (o app não é assinado pela Apple).
            - **Linux:** `.deb` (Ubuntu/Debian: dois cliques) ou `.AppImage` (dê permissão de execução e abra).

            Sem instalar nada: https://enzoipiranga-engineer.github.io/astraroc/
          releaseDraft: false
          prerelease: false
