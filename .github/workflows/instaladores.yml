# Gera os instaladores do app de computador (Tauri) e publica na página de Releases.
# Dispara ao criar uma tag v* (ex.: v0.1.0) ou à mão em Actions.
name: Instaladores
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Criar a versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Cria a página da versão uma vez só; os três instaladores enviam para ela
      # (criada em paralelo, cada sistema abria uma versão própria).
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ASTRA $TAG" --target "$GITHUB_SHA" --notes-file .github/release-notes.md

  build:
    name: Instalador ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            targets: wasm32-unknown-unknown
          - name: macOS (Intel e Apple Silicon)
            # Máquinas Mac Intel: a fila das arm64 vive lotada. O instalador é universal.
            os: macos-15-intel
            args: --target universal-apple-darwin
            targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas do sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseDraft: false
          prerelease: false
