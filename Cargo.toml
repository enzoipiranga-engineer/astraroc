[workspace]
resolver = "2"
members = ["crates/astra-math", "crates/astra-wasm"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
