[package]
name = "astra-desktop"
description = "ASTRA como aplicativo de computador (Tauri): a mesma interface web, rodando sem navegador."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[features]
# Interface embutida no binário (o `tauri dev` usa o servidor do Vite em vez disso).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
