[package]
name = "astra-wasm"
description = "ASTRA: fronteira WebAssembly do núcleo de física (sem lógica de física própria)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
astra-math = { path = "../astra-math" }
astra-env = { path = "../astra-env" }
astra-dynamics = { path = "../astra-dynamics" }
astra-propulsion = { path = "../astra-propulsion" }
astra-vehicle = { path = "../astra-vehicle" }
astra-space = { path = "../astra-space" }
astra-design = { path = "../astra-design" }
astra-mission = { path = "../astra-mission" }
astra-launch = { path = "../astra-launch" }
serde_json = "1"
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
